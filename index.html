<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Análise de Acidentes de Trânsito no Brasil</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0e1117;
            --card-bg: #161b22;
            --card-border: #262730;
            --text-primary: #fafafa;
            --text-secondary: #a3adc2;
            --accent-blue: #4f8bf9;
            --accent-green: #2ea043;
            --accent-red: #ff4b4b;
            --accent-hover: #e03e3e;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.6;
            padding: 40px 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--card-border);
        }

        header h1 {
            font-size: 2rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 10px;
        }

        header p {
            color: var(--text-secondary);
            font-size: 1rem;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 28px;
            margin-bottom: 24px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .card h2 {
            font-size: 1.25rem;
            color: var(--accent-blue);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Informações do projeto */
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-top: 10px;
        }

        .info-item {
            background: rgba(255, 255, 255, 0.03);
            padding: 12px 16px;
            border-radius: 8px;
            border-left: 3px solid var(--accent-blue);
        }

        .info-item span {
            display: block;
            font-size: 0.8rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .info-item strong {
            font-size: 0.95rem;
            color: var(--text-primary);
        }

        /* Métricas / Stats de Cobertura */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
            margin-top: 10px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--card-border);
            padding: 16px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-card h3 {
            font-size: 1.4rem;
            color: var(--accent-blue);
            margin-bottom: 4px;
        }

        .stat-card p {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        /* Destaques sem bullets (Substituindo a lista por Grid Visual) */
        .feature-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 16px;
            margin-top: 16px;
        }

        .feature-box {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 18px;
            transition: border-color 0.2s ease;
        }

        .feature-box:hover {
            border-color: rgba(79, 139, 249, 0.4);
        }

        .feature-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .feature-desc {
            font-size: 0.88rem;
            color: var(--text-secondary);
        }

        /* Badges de tecnologias */
        .tech-pills {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 14px;
        }

        .pill {
            background: rgba(79, 139, 249, 0.1);
            color: var(--accent-blue);
            border: 1px solid rgba(79, 139, 249, 0.25);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .btn-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 16px;
            margin-top: 20px;
        }

        .btn-streamlit {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background-color: var(--accent-red);
            color: #ffffff;
            font-weight: 600;
            font-size: 1rem;
            padding: 14px 28px;
            border-radius: 8px;
            text-decoration: none;
            transition: all 0.2s ease-in-out;
            box-shadow: 0 4px 14px rgba(255, 75, 75, 0.3);
        }

        .btn-streamlit:hover {
            background-color: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 75, 75, 0.4);
        }
